<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>aboutPC — System Intelligence</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <p class="eyebrow">LOCAL SYSTEM INTELLIGENCE</p>
        <h1>about<span>PC</span></h1>
        <p id="host">Connecting to your machine…</p>
      </div>
      <div class="status"><i id="dot"></i><span id="status">CONNECTING</span></div>
    </header>

    <main>
      <section class="cards">
        <article class="card"><div class="label">CPU</div><strong id="cpu">—</strong><small id="cpuMeta">—</small><div class="bar"><b id="cpuBar"></b></div></article>
        <article class="card"><div class="label">MEMORY</div><strong id="memory">—</strong><small id="memoryMeta">—</small><div class="bar"><b id="memoryBar"></b></div></article>
        <article class="card"><div class="label">DISK</div><strong id="disk">—</strong><small id="diskMeta">—</small><div class="bar"><b id="diskBar"></b></div></article>
        <article class="card"><div class="label">NETWORK</div><strong id="network">—</strong><small id="networkMeta">—</small></article>
      </section>

      <section class="grid">
        <article class="panel wide">
          <div class="panelHead"><h2>CPU CORES</h2><span id="freq">—</span></div>
          <div id="cores" class="cores"></div>
        </article>
        <article class="panel">
          <div class="panelHead"><h2>SYSTEM</h2></div>
          <dl id="system"></dl>
        </article>
        <article class="panel wide">
          <div class="panelHead"><h2>TOP PROCESSES</h2><span>CPU</span></div>
          <div id="processes" class="processes"></div>
        </article>
        <article class="panel">
          <div class="panelHead"><h2>BATTERY</h2></div>
          <div id="battery" class="battery">—</div>
        </article>
      </section>
    </main>
    <footer>aboutPC · runs locally · no external API · live via WebSocket</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
